camera:
  device_id: 0
  width: 640
  height: 480
  fps: 30

mediapipe:
  max_num_hands: 1
  model_complexity: 1
  min_detection_confidence: 0.6
  min_tracking_confidence: 0.6

filters:
  min_cutoff: 1.0
  beta: 0.001
  deadband_threshold: 0.5
  timeout_seconds: 0.3

calibration:
  window_size: 150
  gamma: 0.02
  min_sigma: 1.0

session:
  operator_name: "default_user"
